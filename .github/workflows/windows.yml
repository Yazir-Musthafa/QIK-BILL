name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      QIK_ACTIVATION_URL: ${{ vars.QIK_ACTIVATION_URL }}
      QIK_ACTIVATION_PUBLIC_KEY: ${{ vars.QIK_ACTIVATION_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build, test, publish and package (unsigned)
        shell: pwsh
        run: |
          $preview = -not ($env:QIK_ACTIVATION_URL -and $env:QIK_ACTIVATION_PUBLIC_KEY)
          ./scripts/release.ps1 -Version 0.10.0 -AllowUnconfiguredActivation:$preview

      - name: Smoke test the published app
        shell: pwsh
        run: ./scripts/smoke-test.ps1

      - name: Install, start, uninstall
        shell: pwsh
        run: |
          $installer = Get-Item artifacts/installer/QIKSuite-Setup-0.10.0.exe
          $p = Start-Process $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/LOG=artifacts/installer/install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\QIK Suite\QIKSuite.exe'
          if (-not (Test-Path $exe)) { throw "Not installed: $exe" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\QIK Suite\licenses\THIRD-PARTY-NOTICES.txt'))) { throw 'Licence notices missing from the installation.' }
          ./scripts/smoke-test.ps1 -Exe $exe
          $uninstaller = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs\QIK Suite') -Filter 'unins*.exe' | Select-Object -First 1
          $u = Start-Process $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exit code $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw 'The program was not removed.' }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'QIKSuite\qiksuite.db'))) { throw 'Uninstall removed the company data.' }
          Write-Host 'Installed, started, uninstalled; company data kept.'

      - name: Collect app logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/logs | Out-Null
          $logs = Join-Path $env:LOCALAPPDATA 'QIKSuite\logs'
          if (Test-Path $logs) { Copy-Item "$logs\*" artifacts/logs }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.QIK_ACTIVATION_URL != '' && vars.QIK_ACTIVATION_PUBLIC_KEY != '' && 'qiksuite-installer' || 'qiksuite-installer-preview' }}
          path: artifacts/installer

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            artifacts/logs
            artifacts/installer/install.log
          if-no-files-found: ignore
